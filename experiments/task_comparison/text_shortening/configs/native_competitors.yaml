# Native competitor settings for the text_shortening task comparison.
# Same workload, prompt, model family, output contract, and 4-GPU point as the
# MMIRAGE text_shortening recipe, but run through framework-native pipelines.

task:
  name: text_shortening_cnn_dailymail
  source_workload: experiments/task_comparison/text_shortening/workload/workload.jsonl
  warmup_workload: experiments/task_comparison/text_shortening/workload/warmup.jsonl
  mmirage_recipe: experiments/task_comparison/text_shortening/configs/semantic_recipe.yaml
  model: Qwen/Qwen3-4B
  prompt_template: |
    Summarize the following news article in 2 to 3 sentences.
    Keep the summary faithful to the facts in the article.

    Article:
    {{ prompt_text }}
  decoding:
    temperature: 0.0
    max_new_tokens: 128
  output_contract:
    row_order: must_match_input_order
    required_fields:
      - stable_id
      - source_index
      - prompt_sha256
      - prompt_text
      - answer
    validation:
      - processed_rows_equals_input_rows
      - stable_id_set_matches_input
      - no_duplicate_stable_ids
      - prompt_sha256_preserved
      - schema_valid_for_every_row

execution:
  gpu_count: 4
  visible_gpus: [0, 1, 2, 3]
  repetitions: 3
  native_mode: true
  shard_policy: split_input_by_gpu_count_with_one_worker_per_visible_gpu
  output_root: experiments/task_comparison/text_shortening/results/native_competitors
  artifact_policy: generated_outputs_are_ignored_and_not_committed

frameworks:
  datatrove:
    useful_for: text_generation_scaling
    native_backend: DataTrove InferenceRunner with vLLM server_type
    environment: experiments/single_node_h100_scaling/environment/datatrove_uv_requirements.txt
    output_dir: experiments/task_comparison/text_shortening/results/native_competitors/datatrove
    command_template: >-
      {python} experiments/single_node_h100_scaling/scripts/run_datatrove_scaling.py
      --workload-jsonl {workload_jsonl}
      --output-root {output_root}/datatrove
      --gpu-count {gpu_count}
      --visible-gpus {visible_gpus}
      --repetitions {repetitions}
      --model Qwen/Qwen3-4B
  nemo_curator:
    useful_for: text_generation_scaling_with_pipeline_executor
    native_backend: NeMo Curator pipeline plus Data Designer or native LLM stage where available
    environment: experiments/single_node_h100_scaling/environment/nemo_curator_uv_requirements.txt
    output_dir: experiments/task_comparison/text_shortening/results/native_competitors/nemo_curator
    command_template: >-
      {python} experiments/single_node_h100_scaling/scripts/run_nemo_curator_scaling.py
      --workload-jsonl {workload_jsonl}
      --output-root {output_root}/nemo_curator
      --gpu-count {gpu_count}
      --visible-gpus {visible_gpus}
      --repetitions {repetitions}
      --model Qwen/Qwen3-4B

metrics:
  primary:
    - rows_s
    - aggregate_output_tok_s
    - output_tok_s_per_gpu
  validation:
    - processed_rows
    - missing_stable_ids
    - duplicate_stable_ids
    - row_order_matches_input
    - schema_valid_rows
  caveats:
    - Native competitors may use vLLM or framework-managed engines rather than SGLang.
    - Compare throughput only after validation passes for the same task and schema.
