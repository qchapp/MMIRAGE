# Fixed MMIRAGE recipe for the vlm_enrichment task (MedTrinity-25M demo).
# The runner fills only loading/execution placeholders such as paths, shard_id,
# num_shards, and output dirs.

processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen3-VL-4B-Instruct
      tp_size: 1
      trust_remote_code: true
      disable_custom_all_reduce: true
      extra_engine_args:
        max_running_requests: 1000
        mem_fraction_static: 0.88
    chat_template: qwen2-vl
    default_sampling_params:
      temperature: 0.1
      top_p: 0.9
      max_new_tokens: 1024
      custom_params:
        chat_template_kwargs:
          enable_thinking: false

loading_params:
  state_dir: ${MMIRAGE_VLM_STATE_DIR}
  datasets:
    - path: ${MMIRAGE_VLM_INPUT_JSONL}
      type: JSONL
      output_dir: ${MMIRAGE_VLM_OUTPUT_DIR}
      image_base_path: ${MMIRAGE_VLM_IMAGE_BASE_PATH}
  num_shards: ${MMIRAGE_VLM_NUM_SHARDS}
  shard_id: ${MMIRAGE_VLM_SHARD_ID}
  batch_size: ${MMIRAGE_VLM_BATCH_SIZE}

processing_params:
  inputs:
    - name: original_caption
      key: caption
    - name: sample_id
      key: id
    - name: medical_image
      key: image_path
      type: image

  outputs:
    - name: formatted_answer
      type: llm
      output_type: plain
      prompt: |
        Reformat the image description with markdown without adding anything else.
        Add titles and structure your output.

        Image description:
        {{ original_caption }}

  remove_columns: false
  output_schema:
    id: "{{ sample_id }}"
    source_index: "{{ source_index }}"
    conversations:
      - role: "user"
        content: "Describe this medical image."
      - role: "assistant"
        content: "{{ formatted_answer }}"
    modalities:
      - "{{ medical_image }}"

execution_params:
  mode: local
  retry: false
  merge: false
  max_retries: 0
