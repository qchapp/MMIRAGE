# Single MMIRAGE config for the task of the A part of the experimental matrix.
# The A part reuses one dataset transformation (UltraChat -> first user message,
# deterministic shuffle seed 20260813, first unique prompt hashes) and one task:
# rewrite the user request into a helpful assistant response of 4 to 6 sentences.
#
# This file is the one place the task is defined for MMIRAGE. The native
# competitors (raw SGLang, DataTrove, NeMo Curator, distilabel, Ray Data LLM)
# consume the same workload rows and the same prompt template, so the model
# input is byte-identical across every framework and every A setup (GPU scaling,
# H100 vs A100, and shard recovery).
#
# The runner fills only the loading/execution placeholders below (paths,
# num_shards, shard_id, batch_size) so this same file is used by every A setup.

processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen3-4B
      tp_size: 1
      trust_remote_code: true
      disable_custom_all_reduce: true
      extra_engine_args:
        max_running_requests: 1000
        mem_fraction_static: 0.88
    default_sampling_params:
      temperature: 0.0
      max_new_tokens: 256

loading_params:
  state_dir: ${MMIRAGE_A_STATE_DIR}
  datasets:
    - path: ${MMIRAGE_A_WORKLOAD_JSONL}
      type: JSONL
      output_dir: ${MMIRAGE_A_OUTPUT_DIR}
  num_shards: ${MMIRAGE_A_NUM_SHARDS}
  shard_id: ${MMIRAGE_A_SHARD_ID}
  batch_size: ${MMIRAGE_A_BATCH_SIZE}

processing_params:
  inputs:
    - name: stable_id
      key: stable_id
    - name: source_index
      key: source_index
    - name: prompt_text
      key: prompt_text
    - name: prompt_sha256
      key: prompt_sha256

  outputs:
    - name: answer
      type: llm
      output_type: plain
      prompt: |-
        You are helping construct a public text dataset.

        Rewrite the following user request into a helpful assistant response of 4 to 6 sentences.
        Preserve the user's intent.

        User request:
        {{ prompt_text }}

  remove_columns: false
  output_schema:
    stable_id: "{{ stable_id }}"
    source_index: "{{ source_index }}"
    prompt_sha256: "{{ prompt_sha256 }}"
    prompt_text: "{{ prompt_text }}"
    answer: "{{ answer }}"

execution_params:
  mode: local
  retry: false
  merge: false
  max_retries: 0
