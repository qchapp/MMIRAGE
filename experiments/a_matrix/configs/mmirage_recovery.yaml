# MMIRAGE shard-level recovery config for the A matrix (rewrite task, stable_id schema).
# Kubernetes is external orchestration: each pod runs one local MMIRAGE shard.
# The shared-root workload is produced once by scripts/prepare_workload.py
# (--shared-root) as data/ultrachat_200k/{subset,id_order}.jsonl keyed on stable_id.

processors:
  - type: llm
    server_args:
      model_path: Qwen/Qwen3-4B
      tp_size: 1
      trust_remote_code: true
      disable_custom_all_reduce: true
      extra_engine_args:
        max_running_requests: 1000
        mem_fraction_static: 0.88
    default_sampling_params:
      temperature: 0.0
      max_new_tokens: 256

loading_params:
  state_dir: ${MMIRAGE_RECOVERY_STATE_DIR}
  datasets:
    - path: ${MMIRAGE_RECOVERY_INPUT_JSONL}
      type: JSONL
      output_dir: ${MMIRAGE_RECOVERY_OUTPUT_DIR}
  num_shards: 16
  shard_id: "$SLURM_ARRAY_TASK_ID"
  batch_size: 128

processing_params:
  inputs:
    - name: stable_id
      key: stable_id
    - name: source_index
      key: source_index
    - name: prompt_text
      key: prompt_text
    - name: prompt_sha256
      key: prompt_sha256

  outputs:
    - name: answer
      type: llm
      output_type: plain
      prompt: |-
        You are helping construct a public text dataset.

        Rewrite the following user request into a helpful assistant response of 4 to 6 sentences.
        Preserve the user's intent.

        User request:
        {{ prompt_text }}

  remove_columns: false
  output_schema:
    stable_id: "{{ stable_id }}"
    source_index: "{{ source_index }}"
    prompt_sha256: "{{ prompt_sha256 }}"
    prompt_text: "{{ prompt_text }}"
    answer: "{{ answer }}"

execution_params:
  mode: local
  retry: false
  merge: false
  max_retries: 3
  poll_interval_seconds: 30
  settle_time_seconds: 30
