# Optional multi-node split of the A matrix.
#
# The default entry point is `bash experiments/run_all.sh`, which runs the
# whole A matrix (scaling 1/2/4, recovery, text, vlm) on one 4-GPU node.
# The pod assignment below exists only as an internal manual parallelism
# optimization: `run_setup.py --pod pod_a` on one node and
# `run_setup.py --pod pod_b` on another, each running a disjoint subset of
# the same cells that run_all.sh runs. This is not documented for end users
# because run_all.sh handles everything.

pod_a:
  setup: gpu_scaling
  gpu_points: [1, 2]
  extra: [recovery]

pod_b:
  setup: gpu_scaling
  gpu_points: [4]
  extra: [text_shortening, vlm_enrichment]
