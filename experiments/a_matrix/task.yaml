# A part of the experimental matrix: one task, one transformation, defined once.
#
# Every framework (MMIRAGE, raw SGLang, DataTrove, NeMo Curator, distilabel,
# Ray Data LLM) consumes the same workload rows (see scripts/prepare_workload.py)
# and the same prompt template, so the model input is byte-identical across
# frameworks and across the A setups (gpu_scaling, a100_4gpu, recovery).
#
# The template below must stay byte-identical to:
#   - REWRITE_PROMPT_TEMPLATE in experiments/_shared/native_frameworks.py
#   - the `prompt` of the `answer` output in configs/semantic_recipe.yaml
# run_setup.py verifies this before launching any run.

name: ultrachat_rewrite
description: >
  Rewrite the first user message of HuggingFaceH4/ultrachat_200k (train_sft) into
  a helpful assistant response of 4 to 6 sentences, preserving the user's intent.

source:
  dataset: HuggingFaceH4/ultrachat_200k
  split: train_sft
  selection: deterministic_shuffle_first_unique_prompt_hashes
  seed: 20260813
  prompt_message_index: 0
  normalization: whitespace
  num_rows: 5430

model:
  path: Qwen/Qwen3-4B
  max_new_tokens: 256
  temperature: 0.0

prompt_template: |-
  You are helping construct a public text dataset.

  Rewrite the following user request into a helpful assistant response of 4 to 6 sentences.
  Preserve the user's intent.

  User request:
  {{ prompt_text }}

output_contract:
  required_fields: [stable_id, source_index, prompt_sha256, prompt_text, answer]
  row_order: must_match_input_order
