# Setup S1: GPU-count scaling of the A task on 4xH100.
# The framework set is the A-part baseline: MMIRAGE + raw SGLang + DataTrove +
# NeMo Curator. GPU counts 1/2/4 are run per framework, 3 repetitions each.
#
# The run.py path for each GPU count is:
#   - 1:  python run.py --semantic-recipe ... --gpu-count 1 --visible-gpus <g>
#   - 2:  python run.py --semantic-recipe ... --gpu-count 2 --visible-gpus <g1,g2>
#   - 4:  python run.py --semantic-recipe ... --gpu-count 4 --visible-gpus <g1..g4>
# Natives mirror the same shape through run_native_text_competitor.py wrappers.

name: gpu_scaling
accelerator: h100
gpu_count: [1, 2, 4]
frameworks:
  - mmirage
  - raw_sglang
  - datatrove
  - nemo_curator
repetitions: 3
gpus_per_run: 1
