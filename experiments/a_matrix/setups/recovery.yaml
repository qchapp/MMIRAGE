# Setup S3: shard-recovery robustness of the A task across six frameworks.
# The workload is partitioned into 16 shards; each condition is one run per
# framework. "baseline" is the reference with no injected failures (only MMIRAGE
# needs it to compute additional wall time). fail_1 and fail_4 kill shards 3 and
# {1,5,9,13} respectively, at a random mid-run point.
#
# MMIRAGE runs through experiments/shard_recovery/scripts (mmirage_recovery.yaml).
# Natives run through run_native_recovery_competitor.py + native_shard_worker.py.
# The workload is the shared a_matrix one (16-shard split), NOT a separate file:
# prepare_workload.py --shared-root emits data/ultrachat_200k/{subset,id_order}.

name: recovery
accelerator: h100
shards: 16
max_active: 4
conditions:
  - baseline
  - fail_1
  - fail_4
fail_1_shards: [3]
fail_4_shards: [1, 5, 9, 13]
frameworks:
  - mmirage
  - raw_sglang
  - datatrove
  - nemo_curator
  - distilabel
  - ray_data_llm
repetitions: 1
gpus_per_run: 4
