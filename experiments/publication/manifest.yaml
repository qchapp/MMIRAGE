version: 1
repetitions: 3
experiments:
  scaling:
    model: Qwen/Qwen3-4B
    task: ultrachat_rewrite
    frameworks: [mmirage, raw_sglang, datatrove, nemo_curator]
    h100_gpu_points: [1, 2, 4]
    a100_gpu_points: [4]
    temperature: 0.0
    max_new_tokens: 256
    mmirage_batch_size: 64
    native_concurrency: 64
  recovery:
    model: Qwen/Qwen3-4B
    hardware: 4xH100
    total_shards: 16
    max_active_shards: 4
    mmirage_conditions: [baseline, fail_1, fail_4]
    native_frameworks: [raw_sglang, datatrove, nemo_curator, distilabel, ray_data_llm]
    native_conditions: [fail_1, fail_4]
    kill_after_seconds: 30
    temperature: 0.0
    max_new_tokens: 256
    mmirage_batch_size: 64
    native_concurrency: 64
  text_shortening:
    model: Qwen/Qwen3-4B
    hardware: 4xH100
    frameworks: [mmirage, datatrove, nemo_curator]
    temperature: 0.0
    max_new_tokens: 128
    mmirage_batch_size: 64
    native_concurrency: 64
  vlm_enrichment:
    model: Qwen/Qwen3-VL-4B-Instruct
    hardware: 4xH100
    frameworks: [mmirage, sglang, datatrove, nemo_curator]
    temperature: 0.1
    top_p: 0.9
    max_new_tokens: 1024
    mmirage_batch_size: 64
    native_concurrency: 64
  sglang_overhead:
    model: Qwen/Qwen3-4B
    hardware: [1xH100, 1xA100]
    frameworks: [raw_sglang, mmirage_sglang]
    concurrency: 64
    temperature: 0.0
    max_tokens: 1024
entry_points:
  h100: experiments/publication/run_h100.sh
  a100: experiments/publication/run_a100.sh
tracker: experiments/progress_tracker.py
development_only:
  pre_export_verifier: experiments/publication/verify_refactor.py
  anonymous_export_omits:
    - experiments/publication/verify_refactor.py
    - experiments/publication/_verification/
